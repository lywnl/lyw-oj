services:
  oj-mysql-server:
    image: mysql:8.0.40
    pull_policy: if_not_present
    container_name: oj-dev-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: lywoj
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/mysqldata:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 10s
      timeout: 5s
      retries: 12

  oj-redis-server:
    image: redis:7.4-alpine
    pull_policy: if_not_present
    container_name: oj-dev-redis
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  oj-nacos-server:
    image: nacos/nacos-server:v2.4.3
    pull_policy: if_not_present
    container_name: oj-dev-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20

  oj-rabbitmq-server:
    image: rabbitmq:3.8.30-management
    pull_policy: if_not_present
    container_name: oj-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbit/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  oj-canal-server:
    image: canal/canal-server:v1.1.8
    profiles: ["question-sync"]
    entrypoint: ["/bin/sh", "/opt/oj-canal-entrypoint.sh"]
    environment:
      CANAL_HEAP: ${CANAL_HEAP:-256m}
    volumes:
      - ../canal/entrypoint.sh:/opt/oj-canal-entrypoint.sh:ro
      - ${CANAL_CONFIG_DIR:-../../.codex/canal/dev/config}:/config:ro
      - ${CANAL_STATE_DIR:-../../.codex/canal/dev/state}:/state
    mem_limit: 768m
    depends_on:
      oj-mysql-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:11111:11111"
