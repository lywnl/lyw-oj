server:
  port: 9201

spring:
  application:
    name: oj-system

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/oj_dev?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5 # 最小空闲连接数
      maximum-pool-size: 10 # 最大连接数
      idle-timeout: 30000 # 空闲超时时间(毫秒)
      connection-timeout: 30000 # 连接超时时间(毫秒)